site_name: hw-registry
site_description: Curated hardware library for embedded development
site_url: https://rnd-southerniot.github.io/hw-registry/
repo_url: https://github.com/rnd-southerniot/hw-registry
repo_name: rnd-southerniot/hw-registry
edit_uri: edit/main/docs/

# mkdocs.yml lives at the repo root. docs/ holds the Markdown sources;
# rendered output goes to ./site/ (gitignored).
docs_dir: docs
site_dir: site

# Internal-only pages and build helpers must not render on the public site.
exclude_docs: |
  internal/
  gen_component_pages.py
  macros.py
  requirements.txt

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# mkdocs-literate-nav was tried and removed: its SUMMARY.md (emitted by
# gen-files) leaked past exclude_docs (gen-files writes after the file-
# collection filter runs), publishing /SUMMARY/. MkDocs's default file-
# tree nav + section-index produces the same UX without the leak.
plugins:
  - search
  - macros:
      # Path relative to mkdocs.yml. mkdocs-macros loads docs/macros.py.
      module_name: docs/macros
  - gen-files:
      scripts:
        - docs/gen_component_pages.py
  - section-index

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rnd-southerniot/hw-registry
  # `mike` versioning prepared but not active — deployment lands in Prompt 9.
  # version:
  #   provider: mike
  #   default: latest
