[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hwlib-mcp"
version = "0.1.0"
description = "MCP server exposing the hw-registry component bundle to AI coding agents."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Southern IoT Limited", email = "rnd@southerniot.net" },
]
keywords = ["mcp", "fastmcp", "embedded", "hardware", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
]

dependencies = [
    "fastmcp>=2.0",
    # hwlib-data ships the deterministic bundle as a data wheel. Pinned
    # to ^0.1 — bundle-schema major bumps require coordinated mcp release
    # (the SQLite query layer in data.py assumes a specific schema). The
    # MCP server first honors HWLIB_DATA_DIR, then falls back to
    # hwlib_data.data_path(); this dep makes the fallback always available
    # in production wheel installs.
    "hwlib-data>=0.1.0,<0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio",
]

[project.scripts]
hwlib-mcp = "hwlib_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hwlib_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = [
    # Bundle build during the conftest fixture fires the RAK3172 soft-fallback
    # warnings (8× per build). They are intentional CI surface for the root
    # repo's tests; here they're test noise.
    "ignore::tools.builder.errors.AltFunctionShorthandWarning",
]
