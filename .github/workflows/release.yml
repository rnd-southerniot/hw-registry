name: Release

# Triggered by pushing a `v*.*.*` tag. CI (ci.yml) gates merges to main, so
# this workflow trusts that the tagged commit was already lint/test/build-
# verified. release.yml just publishes — it does NOT re-run the full CI
# matrix. Manual workflow_dispatch is for one-off re-runs (e.g. transient
# PyPI / GHCR issue).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write       # GitHub Release creation
  packages: write       # GHCR push
  id-token: write       # trusted publishing OIDC + SLSA attestations
  attestations: write   # SLSA build provenance

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Releases never auto-cancel — once a tag is being processed, finish.
  cancel-in-progress: false

jobs:

  # -----------------------------------------------------------------------
  # Build the deterministic bundle. SOURCE_DATE_EPOCH = tagged commit's
  # timestamp, so re-runs of the same tag produce byte-identical output.
  # -----------------------------------------------------------------------
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0   # git-cliff in github-release needs history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: '**/pyproject.toml'
      - run: pip install -e ".[dev]"
      - name: Build deterministic bundle
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct ${{ github.ref }})
          python -m tools.builder --out dist/
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/
          retention-days: 90

  # -----------------------------------------------------------------------
  # Build wheels + sdists for both packages. Uploaded as separate named
  # artifacts so publish-pypi-* jobs can target them with a clean
  # packages-dir without nested-path gymnastics.
  # -----------------------------------------------------------------------
  build-wheels:
    runs-on: ubuntu-latest
    needs: build-bundle
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: '**/pyproject.toml'
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist/
      - run: pip install build
      - name: Build hwlib-data
        run: cd packages/hwlib-data && python -m build
      - name: Build hwlib-mcp
        run: cd packages/hwlib-mcp && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-hwlib-data
          path: packages/hwlib-data/dist/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-hwlib-mcp
          path: packages/hwlib-mcp/dist/
          retention-days: 90

  # -----------------------------------------------------------------------
  # Trusted publishing for hwlib-data. Environment must exist on the repo
  # AND the matching trusted-publisher config must exist on PyPI; both are
  # one-time setup. `attestations: true` produces PEP 740 attestations
  # (signed via Sigstore) alongside the wheel — replaces the standalone
  # actions/attest-build-provenance job in older patterns.
  # -----------------------------------------------------------------------
  publish-pypi-data:
    runs-on: ubuntu-latest
    needs: build-wheels
    environment:
      name: pypi-hwlib-data
      url: https://pypi.org/p/hwlib-data
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-hwlib-data
          path: dist/
      - name: Publish hwlib-data to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true

  publish-pypi-mcp:
    runs-on: ubuntu-latest
    needs: build-wheels
    environment:
      name: pypi-hwlib-mcp
      url: https://pypi.org/p/hwlib-mcp
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-hwlib-mcp
          path: dist/
      - name: Publish hwlib-mcp to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true

  # -----------------------------------------------------------------------
  # Push to GHCR. metadata-action computes tags: full v0.1.0, semver
  # major.minor (v0.1), and `latest`. provenance + sbom flags emit SLSA
  # attestations and CycloneDX SBOMs alongside the image manifest.
  # -----------------------------------------------------------------------
  publish-ghcr:
    runs-on: ubuntu-latest
    needs: build-bundle
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hwlib-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/hwlib-mcp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # -----------------------------------------------------------------------
  # Final job: gather artifacts, generate changelog, attach to GitHub
  # Release. Depends on the publish jobs so a partial failure (PyPI up
  # but GHCR down, etc.) doesn't produce a half-baked Release page.
  # -----------------------------------------------------------------------
  github-release:
    runs-on: ubuntu-latest
    needs:
      - publish-pypi-data
      - publish-pypi-mcp
      - publish-ghcr
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: wheels-hwlib-data
          path: wheels/hwlib-data/
      - uses: actions/download-artifact@v4
        with:
          name: wheels-hwlib-mcp
          path: wheels/hwlib-mcp/
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist/
      # Direct git-cliff binary install instead of orhun/git-cliff-action@v3.
      # The action's Dockerfile uses a Debian Buster base whose apt repos
      # were moved to archive.debian.org after 2024-06-30 EOL — `apt-get
      # update` returns 404 on every CI run since. Pinning git-cliff to a
      # specific version and installing from the upstream release tarball
      # makes our dependency surface explicit (one curl, one binary).
      # If a future git-cliff release breaks our cliff.toml, we choose
      # when to bump.
      - name: Install git-cliff
        run: |
          GIT_CLIFF_VERSION=2.6.1
          BASE="https://github.com/orhun/git-cliff/releases/download"
          ARCHIVE="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "${BASE}/v${GIT_CLIFF_VERSION}/${ARCHIVE}" -o /tmp/gc.tar.gz
          tar -xzf /tmp/gc.tar.gz -C /tmp
          sudo mv /tmp/git-cliff-*/git-cliff /usr/local/bin/git-cliff
          git-cliff --version
      - name: Generate release notes (latest tag, body only)
        run: |
          git-cliff --config cliff.toml --latest --strip header > /tmp/release-notes.md
      - name: Compute SHA256SUMS
        run: |
          (
            cd dist
            sha256sum library.json library.sqlite index.json
          ) > SHA256SUMS
          (
            cd wheels
            find . -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print0 \
              | xargs -0 sha256sum
          ) >> SHA256SUMS
          mv SHA256SUMS dist/SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wheels/hwlib-data/*
            wheels/hwlib-mcp/*
            dist/library.json
            dist/library.sqlite
            dist/index.json
            dist/SHA256SUMS
          body_path: /tmp/release-notes.md
          generate_release_notes: false
          draft: false
          make_latest: true
          # Any tag with `-` is a prerelease per semver (-rc, -beta, -alpha, etc.).
          # Stable releases are bare `vX.Y.Z` with no hyphen.
          prerelease: ${{ contains(github.ref_name, '-') }}
