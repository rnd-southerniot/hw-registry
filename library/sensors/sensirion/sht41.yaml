# yaml-language-server: $schema=../../../schemas/sensor.schema.json
# SPDX-License-Identifier: CC-BY-4.0
apiVersion: hwreg/v1
kind: sensor
id: sensors/sensirion/sht41
revision: 1.0.0
summary: "I2C T/RH sensor, addr 0x44, ±0.2 °C / ±1.8 %RH, DFN-4 1.5×1.5mm"
description: >
  Sensirion fourth-generation digital humidity and temperature sensor.
  Two-wire I²C interface. ±0.2 °C accuracy on temperature and ±1.8 %RH
  on relative humidity over the calibrated range. Single-supply
  1.08–3.6 V, sub-µA sleep current, integrated heater, NIST-traceable
  factory calibration. SHT41-AD1B variant has the address strap pulled
  to 0x44.
tags: [temperature, humidity, i2c, sensirion, low-power]
vendor: sensirion
manufacturer_part_number: SHT41-AD1B
tested:
  status: production-tested
  by: rnd@southerniot.net
  date: 2026-01-08
  evidence: "Field-deployed in LoRaWAN T/RH nodes since 2025-Q4."
lifecycle: stable
code_owner: "@rnd-southerniot/sensors"
electrical:
  vcc:
    nominal_v: 3.3
    min_v: 1.08
    max_v: 3.6
  current_draw:
    typ_active_mA: 0.4
    sleep_uA: 0.08
  logic:
    voltage_v: 3.3
    family: cmos_3v3
    five_v_tolerant: false
interface:
  type: i2c
  speed_max_khz: 1000
constraints:
  i2c:
    address: 0x44
    address_pin_options: [0x44, 0x45]
    requires_pullups_ohms: 10000
  interrupt:
    required: false
  power:
    min_startup_time_ms: 1.0
    requires_decoupling: ["100nF X7R close to VDD"]
  operating_temp_c:
    min_c: -40
    max_c: 125
  accuracy:
    temp_c: "±0.2"
    rh_pct: "±1.8"
  response_time_ms: 4.0
package:
  type: DFN-4
  pin_count: 4
  ipc_name: "DFN40P150X150X50-4N"
  dimensions:
    length_mm: 1.5
    width_mm: 1.5
    height_mm: 0.5
drivers:
  - drivers/sensirion/sht41
kicad:
  symbol: "hw-registry:SHT41"
  footprint: "hw-registry:Sensirion_DFN-4-1EP_1.5x1.5mm"
external_refs:
  cpe: "cpe:2.3:h:sensirion:sht41:-:*:*:*:*:*:*:*"
  purl: "pkg:generic/sensirion/sht41"
assets:
  datasheet:
    primary_url: https://sensirion.com/media/documents/33FD6951/662A593A/HT_DS_Datasheet_SHT4x.pdf
    archived_url: https://web.archive.org/web/20240801000000/https://sensirion.com/media/documents/33FD6951/662A593A/HT_DS_Datasheet_SHT4x.pdf
