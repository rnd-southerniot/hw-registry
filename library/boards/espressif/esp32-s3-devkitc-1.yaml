apiVersion: hwreg/v1
kind: board
id: boards/espressif/esp32-s3-devkitc-1
revision: 1.1.0
summary: "ESP32-S3-WROOM-1, 8MB flash, 8MB octal PSRAM, dual USB-C"
description: >
  Espressif's reference development board for the ESP32-S3-WROOM-1
  N8R8 module. Two USB-C connectors — one wired to the on-module
  native USB (GPIO19/GPIO20), one through a CP210x UART bridge.
  Two 22-pin headers (J1, J3) expose the GPIOs that the WROOM-1
  N8R8 variant brings out (GPIO0–GPIO21 plus GPIO38–GPIO48; GPIO33–
  GPIO37 are reserved internally for the octal PSRAM and not
  available externally).
tags: [esp32-s3, wifi, ble, usb-otg, lx7, dev-board]
vendor: espressif
manufacturer_part_number: ESP32-S3-DevKitC-1-N8R8
tested:
  status: production-tested
  by: rnd@southerniot.net
  date: 2026-02-14
  evidence: "Used as primary bring-up board in 2+ years of in-house projects."
lifecycle: stable
code_owner: "@rnd-southerniot/boards"
inherits_from:
  - modules/espressif/esp32-s3-wroom-1@1.0.0
peripherals:
  uart: 3
  i2c: 2
  spi: 4
  adc: 2
  pwm_channels: 8
  usb: 1
  i2s: 2
  rmt: 8
  touch: 14
electrical:
  vcc:
    nominal_v: 5.0
    min_v: 4.0
    max_v: 5.5
    source: usb-c
  logic:
    voltage_v: 3.3
    family: cmos_3v3
    five_v_tolerant: false
  power_budget_mA: 500
discovery:
  usb:
    - vid: "303A"
      pid: "1001"
      description: "ESP32-S3 native USB"
    - vid: "10C4"
      pid: "EA60"
      description: "CP210x bridge to UART"
strapping_pins: [GPIO0, GPIO3, GPIO45, GPIO46]
reserved_pins: [GPIO19, GPIO20]
pins:
  - id: GPIO0
    aliases: [BOOT]
    voltage_domain: vdd_io
    default: gpio
    alt_functions:
      - { function: gpio, direction: bidir }
  - id: GPIO1
    voltage_domain: vdd_io
    default: gpio
    alt_functions:
      - { function: gpio, direction: bidir }
      - { function: adc_in, peripheral: adc1, channel: 0 }
      - { function: touch, peripheral: touch1 }
  - id: GPIO2
    voltage_domain: vdd_io
    default: gpio
