[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hw-registry-tools"
version = "0.1.0"
description = "Dev tooling for the hw-registry hardware library: Pydantic models, schema generator, validators, bundle builder."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Southern IoT Limited", email = "rnd@southerniot.net" },
]
keywords = ["hardware", "embedded", "registry", "pydantic", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
]

dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "click>=8.1",
    "networkx>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "syrupy",
    "ruff",
    "mypy",
    "pre-commit",
    "check-jsonschema",
    "types-pyyaml",
]

[project.scripts]
hwlib-genschema = "tools.generate_schemas:main"
hwlib-build = "tools.builder.build:main"
hwlib-check-conflicts = "tools.conflicts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pydantic_models", "tools"]

# --- Ruff ----------------------------------------------------------------
# Trigger: if per-line `# noqa: E501` markers in pydantic_models/ exceed 20,
# switch to `[tool.ruff.lint.per-file-ignores] "pydantic_models/*" = ["E501"]`
# rather than carrying the noqa farm. Long Pydantic Field descriptions are
# the dominant source; explicit per-site noqas are preferred until the
# count tips category-level exemption into a clearer win.
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

# --- Mypy ----------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = [
    "^tests/",
    "^build/",
    "^dist/",
    "^site/",
    "^packages/",
]

[[tool.mypy.overrides]]
# networkx ships type stubs in a separate package and not all distributions
# pick them up; the conflict checker uses only well-typed surface (graph
# construction + edge iteration) and casts at the boundaries.
module = "networkx"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- Pytest --------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "docs: integration tests that build the MkDocs site (requires `make docs-deps`)",
]
filterwarnings = [
    # The Pydantic model `Tested` matches pytest's default class-collection
    # prefix; pytest correctly skips it (Pydantic models have __init__) but
    # warns. The model name is right; suppress the noise.
    "ignore:cannot collect test class 'Tested':pytest.PytestCollectionWarning",
    # AltFunctionShorthandWarning fires whenever a Module override uses
    # shorthand against a parent that does not define the function (e.g.
    # RAK3172 against the bare STM32WLE5JC stub). It is intentional CI
    # surface, not test noise — the targeted test
    # test_alt_function_shorthand_soft_fallback re-enables it via
    # pytest.warns. Globally filtered here so the other tests that build
    # the real library are not flooded with expected warnings.
    "ignore::tools.builder.errors.AltFunctionShorthandWarning",
]
