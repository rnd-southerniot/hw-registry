# yamllint config — applied to every YAML in the repo via pre-commit.
# Component YAMLs under library/ also pass JSON Schema validation; this
# layer catches stylistic drift before schema validation runs.

extends: default

rules:
  line-length:
    max: 120
    level: error
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true

  indentation:
    spaces: 2
    indent-sequences: consistent
    check-multi-line-strings: false

  document-start: disable

  truthy:
    allowed-values: ["true", "false"]
    check-keys: false

  comments-indentation: disable

  # Inline flow-style mappings ({ key: value, key: value }) are heavily used
  # in component YAMLs for compact alt_function entries. Allow one space
  # inside braces — matches the BLUEPRINT.md example style.
  braces:
    max-spaces-inside: 1
    min-spaces-inside: 0
    max-spaces-inside-empty: 0
    min-spaces-inside-empty: 0
